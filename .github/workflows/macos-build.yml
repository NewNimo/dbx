name: macOS Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (leave empty for current branch)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS (Apple Silicon / aarch64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Build macOS DMG
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg --ci --no-sign

      - name: List generated bundles
        shell: bash
        run: |
          echo "=== Generated DMG files ==="
          ls -lh target/aarch64-apple-darwin/release/bundle/dmg/

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBX-macOS-arm64-dmg
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30
          if-no-files-found: error
